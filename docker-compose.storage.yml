# Optional: your own S3-compatible bucket for the Library's original files (SeaweedFS, Apache-2.0), instead of the local data folder.
#   docker compose -f docker-compose.yml -f docker-compose.storage.yml up -d
# Put these in .env (the app and the worker read them; or enter the same values on Settings > Storage):
#   STORAGE_DRIVER=s3
#   S3_ENDPOINT=http://s3:8333
#   S3_BUCKET=library
#   S3_ACCESS_KEY=<pick one>            S3_SECRET_KEY=<pick one, long and random>
#   S3_PATH_STYLE=true                  S3_REGION=us-east-1
# The bucket is created on first start. Choose the storage BEFORE the first upload: files already stored are not moved when the driver changes.
# Nothing is published on the host: only the app (and the worker) reach the store, over the compose network. Any other S3 service (AWS, Ceph,
# Cloudflare R2, a MinIO you run yourself...) works the same way without this file: just fill in the same settings.
services:
  s3:
    image: chrislusf/seaweedfs:4.50                          # pinned (Apache-2.0); bump deliberately
    restart: unless-stopped
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=0", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}          # the one identity the app uses (admin of this store)
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/ && curl -sf http://localhost:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  s3-init:                                                    # creates the bucket once, then exits
    image: amazon/aws-cli:2.17.0
    restart: "no"
    depends_on:
      s3: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    entrypoint: ["sh", "-c", "aws --endpoint-url http://s3:8333 s3api head-bucket --bucket \"$$BUCKET\" 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb \"s3://$$BUCKET\""]

volumes:
  s3_data:
