name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # --no-deps, as in the image: the lock lists every package and overrides one pin (see requirements.lock)
          pip install --require-hashes --no-deps -r backend/requirements.lock
          pip install -r backend/requirements-dev.txt pip-audit
      - name: Tests (768-dimension embeddings)
        working-directory: backend
        run: python -m pytest -q tests
      - name: Tests (3000-dimension embeddings, the halfvec path)
        working-directory: backend
        env:
          EMBEDDING_DIM: "3000"
        run: python -m pytest -q tests
      - name: Known vulnerabilities (Python)
        run: pip-audit -r backend/requirements.lock --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build
      - name: Known vulnerabilities (runtime packages)
        run: npm audit --omit=dev

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -t seamory-ai:ci .
      - name: Build the browser-service image
        run: docker build -f Dockerfile.fetcher -t seamory-fetcher:ci .
